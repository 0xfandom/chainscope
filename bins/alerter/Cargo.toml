[package]
name = "chainscope-alerter"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[lib]
name = "chainscope_alerter"
path = "src/lib.rs"

[[bin]]
name = "chainscope-alerter"
path = "src/main.rs"

[dependencies]
# Reuse M6's swap valuation (pnl::classify + Numeraire) rather than re-deriving
# it. This pulls the indexer lib (and librdkafka) into the build, which is fine
# off the alerter's non-latency-critical path.
chainscope-core = { path = "../../crates/core" }
chainscope-indexer = { path = "../indexer" }
bigdecimal.workspace = true
hex.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tokio-util.workspace = true
reqwest.workspace = true

[dev-dependencies]
url.workspace = true
