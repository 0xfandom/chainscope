[package]
name = "chainscope-indexer"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[lib]
name = "chainscope_indexer"
path = "src/lib.rs"

[[bin]]
name = "chainscope-indexer"
path = "src/main.rs"

[dependencies]
# `kafka` on: the indexer is the process that actually runs the log transport,
# so it compiles the librdkafka client. No other crate turns this on.
chainscope-core = { path = "../../crates/core", features = ["kafka"] }
chainscope-eth-source = { path = "../../crates/eth-source" }
# PnL cost-basis maths runs on NUMERIC amounts, which are BigDecimal.
bigdecimal.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sqlx.workspace = true
dotenvy.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
# Streaming a partition out via COPY TO STDOUT before it is dropped (#114).
futures = "0.3"
figment.workspace = true
hex.workspace = true
url.workspace = true
tokio-util.workspace = true
rand.workspace = true
async-trait.workspace = true

[dev-dependencies]
# `test` brings in figment::Jail, which gives each test its own temporary
# directory and environment and restores both afterwards — the only safe way to
# test environment-variable layering, since the environment is process-global.
figment = { version = "0.10", features = ["toml", "env", "test"] }
# The live_pipeline test builds an EthSource against a real RPC URL and creates
# ephemeral databases.
url.workspace = true
# The kafka_roundtrip test creates a throwaway topic via the admin client before
# round-tripping through the transport. Same client the core transport uses.
rdkafka = { version = "0.39", default-features = false, features = ["cmake-build", "tokio"] }
