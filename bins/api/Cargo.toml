[package]
name = "chainscope-api"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[lib]
name = "chainscope_api"
path = "src/lib.rs"

[[bin]]
name = "chainscope-api"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum.workspace = true
tower-http.workspace = true
# The API owns its own read-only queries against the shared schema rather than
# depending on the indexer lib, which would drag in librdkafka for no reason.
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
bigdecimal.workspace = true
hex.workspace = true
prometheus = { workspace = true }

[dev-dependencies]
# Router implements tower::Service, so tests drive handlers via `oneshot`
# without binding a socket.
tower.workspace = true
url.workspace = true
