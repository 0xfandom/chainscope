# Chainscope configuration.
#
# This file holds everything shareable. Anything secret — the database URL and
# RPC endpoints, which carry API keys — belongs in .env instead, because this
# file is committed and .env is not.
#
# Every value here can be overridden by an environment variable named
# CHAINSCOPE_<SECTION>__<KEY>, double underscore between the two, e.g.
#   CHAINSCOPE_PIPELINE__BATCH_SIZE=1000
#   CHAINSCOPE_CHAIN__POOLS=0xaaa...,0xbbb...      (lists are comma-separated)
# The environment always wins.

[database]
# url comes from DATABASE_URL in .env — deliberately not set here.
max_connections = 5

[chain]
chain_id = 1

# rpc_endpoints comes from CHAINSCOPE_CHAIN__RPC_ENDPOINTS in .env.
# Two or three providers give failover when one starts rate-limiting.

# Uniswap V3 factory on mainnet. Source of PoolCreated for the sniffer.
factory = "0x1f98431c8ad98523631ae4a59f267346ea31f984"

# Pools to index. Start with one and widen once the pipeline is proven.
pools = [
    "0x8ad599c3a0ff1de082011efddc58f1908eb6e6d8", # USDC/WETH 0.05%
    "0x88e6a0c2ddd26feeb64f039a2c41296fcb3f5640", # USDC/WETH 0.3%
]

# Where indexing begins. For a live-follow demo without deep backfill, set this
# near the current head (e.g. head - 7200 ≈ the last day) so the follower catches
# up in minutes instead of crawling from genesis. For full history, use the pool
# creation block (Uniswap V3 factory deployed at 12369621) — but that needs an
# archive RPC, since free tiers cap eth_getLogs history.
start_block = 0

# How often the producer asks for the chain head. Ethereum produces a block
# every ~12s, so polling much faster just spends RPC quota.
poll_interval_ms = 4000

# Blocks behind the head before a block is treated as irreversible.
# ~64 is two Ethereum epochs, which is where Casper FFG finalises.
finality_depth = 64

[pipeline]
# How the stages talk to each other. "channel" is in-memory, single process.
# The log-based transport (Redpanda) arrives in M5 and is a change to this line,
# not to any stage.
transport = "channel"

# Bounded channels between stages. This is the backpressure knob: when the
# writer falls behind, the fetcher blocks instead of growing a queue in memory.
channel_capacity = 1024

# Rows per database transaction.
batch_size = 500

# A partial batch is written after this long even if it has not reached
# batch_size, so a quiet chain does not hold the last few blocks unwritten.
flush_interval_ms = 2000

# How long graceful shutdown waits for the stages to wind down before the
# process aborts. Generous, because the writer may be mid-commit when the
# signal lands, and a killed commit simply replays on the next start.
shutdown_timeout_ms = 10000

# Blocks per historical backfill work unit. Shrinks automatically when a
# provider rejects the range as too wide.
backfill_chunk_size = 2000

# PnL numeraire: which tokens count as "money" so a trade can be valued in USD.
# Absent (as here) the profit fold is OFF and the indexer runs without PnL —
# wallet_stats and the leaderboard stay empty. Uncomment and fill in to turn it
# on. Rule: a token you list here is treated as money; a token you DON'T list is
# an asset whose profit gets tracked. So to track WETH PnL on a USDC/WETH pool,
# list USDC as a stable and leave WETH out.
#
# [pnl]
# stables = ["0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48"]  # USDC
# weth = "0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2"       # optional: value WETH as money
# weth_price_pool = "0x88e6a0c2ddd26feeb64f039a2c41296fcb3f5640"  # USDC/WETH pool to price WETH

[log]
# tracing-subscriber env filter. RUST_LOG overrides this.
filter = "info"
